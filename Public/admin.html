<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Admin Dashboard</h2>
  <p>Upload transcript securely</p>

  <!-- FILE UPLOAD -->
  <input type="file" id="file" />
  <button onclick="uploadTranscript()">Upload Transcript</button>

  <p id="status"></p>

  <hr>

  <h4>Security Outputs</h4>
  <p><b>SHA-256 Hash:</b></p>
  <textarea id="hash" rows="2" style="width:100%" readonly></textarea>

  <p><b>Digital Signature:</b></p>
  <textarea id="signature" rows="3" style="width:100%" readonly></textarea>

  <br>
  <button onclick="logout()">Logout</button>
</div>

<script src="app.js"></script>
</body>
</html>
