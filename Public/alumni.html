<!DOCTYPE html>
<html>
<head>
  <title>Alumni Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Alumni Dashboard</h2>
  <h3>Request New Document</h3>

<select id="docType">
  <option value="Transcript">Transcript</option>
  <option value="Degree Certificate">Degree Certificate</option>
  <option value="Bonafide Certificate">Bonafide Certificate</option>
</select>

<textarea id="reason" placeholder="Reason for request"></textarea>

<button onclick="requestDocument()">Submit Request</button>

<p id="requestMsg"></p>

<hr>

  <p>View and download your transcript securely</p>

  <button onclick="downloadTranscript()">Download Transcript</button>

  <p id="msg"></p>

  <hr>

  <h4>Base64 Encoded Transcript</h4>
  <textarea id="base64" rows="8" style="width:100%" readonly></textarea>
  <button onclick="downloadOriginal()">Download Original Transcript</button>

  <br>
  <button onclick="logout()">Logout</button>
</div>

<script src="app.js"></script>
</body>
</html>
